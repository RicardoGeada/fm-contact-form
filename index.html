<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Contact form</title>

    <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
    <style>
      .attribution {
        font-size: 0.6875rem;
        text-align: center;
      }
      .attribution a {
        color: hsl(228, 45%, 44%);
      }
    </style>
    <link rel="stylesheet" href="fonts.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <article class="card">
        <h1 class="heading">Contact Us</h1>
        <form action="">
          <fieldset>
            <legend class="sr-only">Name</legend>

            <div class="custom-input body-sm">
              <label for="firstName">First Name <span class="required">*</span></label>
              <input
                type="text"
                id="firstName"
                class="body-md-regular"
                required
              />
              <p class="error-message body-sm">This field is required</p>
            </div>

            <div class="custom-input body-sm">
              <label for="lastName">Last Name <span class="required">*</span></label>
              <input
                type="text"
                id="lastName"
                class="body-md-regular"
                required
              />
              <p class="error-message body-sm">This field is required</p>
            </div>
          </fieldset>

          <div class="custom-input body-sm">
            <label for="email">Email Address <span class="required">*</span></label>
            <input type="email" id="email" class="body-md-regular" required />
            <p class="error-message body-sm">
              Please enter a valid email address
            </p>
          </div>

          <fieldset>
            <legend>Query Type <span class="required">*</span></legend>

            <label class="custom-radio">
              <input
                type="radio"
                id="generalEnquiry"
                name="queryType"
                value="general enquiry"
                required
              />
              <span>General Enquiry</span>
            </label>

            <label class="custom-radio">
              <input
                type="radio"
                id="supportRequest"
                name="queryType"
                value="support request"
                required
              />
              <span>Support Request</span>
            </label>
          </fieldset>

          <div class="custom-input body-sm">
            <label for="message">Message <span class="required">*</span></label>
            <textarea
              name="message"
              id="message"
              class="body-md-regular"
              required
            ></textarea>
            <p class="error-message body-sm">This field is required</p>
          </div>

          <div class="custom-checkbox">
            <input type="checkbox" name="consent" id="consent" required />
            <label for="consent"
              >I consent to being contacted by the team <span class="required">*</span></label
            >
          </div>

          <button type="submit" class="body-md-bold">Submit</button>
        </form>
      </article>
    </main>

    <div class="toast" role="status" aria-atomic="true" hidden>
      <img src="./assets/images/icon-success-check.svg" alt="" />
      <span>Message Sent!</span>
      <p>Thanks for completing the form. We'll be in touch soon!</p>
    </div>

    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by <a href="#">Your Name Here</a>.
    </footer>
  </body>
</html>
