<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  
  <title>Frontend Mentor | Contact form</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main>
    <article>
      <h1>Contact us</h1>
      <form action="">

        <fieldset>
          <legend>Name</legend>

          <div>
            <label for="firstName">First Name *</label>
            <input type="text" id="firstName" required>
          </div>
          
          <div>
            <label for="lastName">Last Name *</label>
            <input type="text" id="lastName" required>
          </div>

        </fieldset>

        <div>
          <label for="email">Email *</label>
          <input type="email" id="email" required>
        </div>

        <fieldset>
          <legend>Query Type *</legend>
          
          <div>
            
            <input type="radio" id="generalEnquiry" name="queryType" value="general enquiry" required>
            <label for="generalEnquiry">General Enquiry</label>
            <input type="radio" id="supportRequest" name="queryType" value="support request" required>
            <label for="supportRequest">Suupport Request</label>
          </div>
        </fieldset>

        <div>
          <label for="message">Message *</label>
          <textarea name="message" id="message" required></textarea>
        </div>

        <div>
          <input type="checkbox" name="consent" id="consent" required>
          <label for="consent">I consent to being contacted by the team *</label>
        </div>

        <button type="submit">Submit</button>
      </form>
    </article>
  </main>

  <div class="toast" role="status" aria-atomic="true" hidden>
    <img src="./assets/images/icon-success-check.svg" alt=""> 
    <span>Message Sent!</span>
    <p>Thanks for completing the form. We'll be in touch soon!</p>
  </div>
  
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Your Name Here</a>.
  </footer>
</body>
</html>
